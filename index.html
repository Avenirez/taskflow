<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
  <meta name="description" content="Aplikasi To-Do List modern dan interaktif">
  <title>Tugasku</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-container">
    <!-- Background Elements for Glassmorphism Glow -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <main class="todo-card">
      <!-- Header -->
      <header class="todo-header">
        <div class="header-main">
          <div>
            <h1>Tugasku</h1>
            <p class="subtitle" id="current-date">Memuat tanggal...</p>
          </div>
          <div class="header-actions">
            <button type="button" id="sound-toggle" class="sound-toggle-btn" aria-label="Toggle Suara" title="Suara: Aktif">
              <svg class="sound-icon sound-icon-on" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
              </svg>
              <svg class="sound-icon sound-icon-off hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
              </svg>
            </button>
            <div class="theme-badge">
              <span class="pulse-dot"></span>
              Personal App
            </div>
          </div>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
          <div class="progress-info">
            <span class="progress-label">Progres Tugas</span>
            <span class="progress-percentage" id="progress-text">0%</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
        </div>
      </header>

      <!-- Input Form -->
      <form id="todo-form" class="todo-form-container">
        <div class="todo-input-group">
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <input type="text" id="todo-input" placeholder="Tambah tugas baru..." aria-label="Tulis tugas baru" required
              autocomplete="off" maxlength="160">
          </div>
          <button type="submit" class="btn-add" aria-label="Tambah tugas">
            <span>Tambah</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>

        <!-- Meta Inputs: Priority, Date, Category -->
        <div class="todo-meta-inputs">
          <div class="meta-input-group">
            <label for="todo-priority" class="meta-label">Skala Prioritas</label>
            <select id="todo-priority" aria-label="Prioritas" title="Pilih Prioritas">
              <option value="rendah">🟢 Rendah</option>
              <option value="sedang" selected>🟡 Sedang</option>
              <option value="tinggi">🔴 Tinggi</option>
            </select>
          </div>
          <div class="meta-input-group">
            <label for="todo-date" class="meta-label">Tenggat Waktu</label>
            <input type="date" id="todo-date" aria-label="Batas Waktu" title="Batas Waktu">
          </div>
          <div class="meta-input-group">
            <label for="todo-category" class="meta-label">Kategori Tugas</label>
            <select id="todo-category" aria-label="Kategori" title="Pilih Kategori">
              <option value="umum" selected>📁 Umum</option>
              <option value="kerja">💼 Kerja</option>
              <option value="pribadi">👤 Pribadi</option>
              <option value="belanja">🛒 Belanja</option>
            </select>
          </div>
        </div>
      </form>

      <!-- Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="search-input" placeholder="Cari tugas..." aria-label="Cari tugas" autocomplete="off" maxlength="80">
      </div>

      <!-- Category Filter Chips -->
      <div class="category-filters" id="category-filters" role="group" aria-label="Filter Kategori">
        <button type="button" class="category-chip active" data-category="all">✨ Semua</button>
        <button type="button" class="category-chip" data-category="umum">📁 Umum</button>
        <button type="button" class="category-chip" data-category="kerja">💼 Kerja</button>
        <button type="button" class="category-chip" data-category="pribadi">👤 Pribadi</button>
        <button type="button" class="category-chip" data-category="belanja">🛒 Belanja</button>
      </div>

      <!-- Filters & Stats -->
      <div class="todo-controls">
        <div class="filter-tabs" role="tablist">
          <div class="slider-indicator" id="slider-indicator"></div>
          <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true"
            id="tab-all">Semua <span class="tab-badge" id="count-all">0</span></button>
          <button class="filter-tab" data-filter="active" role="tab" aria-selected="false"
            id="tab-active">Aktif <span class="tab-badge" id="count-active">0</span></button>
          <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false"
            id="tab-completed">Selesai <span class="tab-badge" id="count-completed">0</span></button>
        </div>
      </div>

      <!-- Todo List Container -->
      <div class="todo-list-wrapper">
        <ul id="todo-list" class="todo-list">
          <!-- Tugas akan dirender di sini secara dinamis -->
        </ul>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon-wrapper">
            <svg id="empty-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              class="empty-icon">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
          </div>
          <h3 id="empty-title">Tidak ada tugas!</h3>
          <p id="empty-desc">Belum ada tugas. Selamat menikmati waktu luang Anda!</p>
        </div>
      </div>

      <!-- Footer Info -->
      <footer class="todo-footer">
        <span class="items-count" id="items-count">0 tugas tersisa</span>
        <button id="clear-completed" class="btn-clear hidden">
          Hapus Semua yang Selesai
        </button>
      </footer>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Edit Tugas</h2>
        <button type="button" class="btn-close-modal" id="modal-close" aria-label="Tutup modal">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form id="edit-form" class="modal-form">
        <div class="modal-form-group">
          <label for="edit-text" class="meta-label">Nama Tugas</label>
          <input type="text" id="edit-text" required autocomplete="off" placeholder="Tuliskan nama tugas..." maxlength="160">
        </div>
        <div class="modal-meta-grid">
          <div class="meta-input-group">
            <label for="edit-priority" class="meta-label">Skala Prioritas</label>
            <select id="edit-priority">
              <option value="rendah">🟢 Rendah</option>
              <option value="sedang">🟡 Sedang</option>
              <option value="tinggi">🔴 Tinggi</option>
            </select>
          </div>
          <div class="meta-input-group">
            <label for="edit-date" class="meta-label">Tenggat Waktu</label>
            <input type="date" id="edit-date">
          </div>
          <div class="meta-input-group">
            <label for="edit-category" class="meta-label">Kategori</label>
            <select id="edit-category">
              <option value="umum">📁 Umum</option>
              <option value="kerja">💼 Kerja</option>
              <option value="pribadi">👤 Pribadi</option>
              <option value="belanja">🛒 Belanja</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-modal-cancel" id="modal-cancel">Batal</button>
          <button type="submit" class="btn-modal-save">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container (Undo) -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <!-- Javascript -->
  <script src="app.js"></script>
</body>

</html>
